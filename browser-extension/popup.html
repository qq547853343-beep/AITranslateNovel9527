<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>保存网页选区</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>保存网页选区</h1>
    <p>先在网页中选择需要的文字和图片，再点击下方按钮。栅格图片保持原字节；安全 SVG 保留原件并生成 PNG 预览。</p>
    <button id="save" type="button">保存为网页 ZIP</button>
    <div id="status" role="status" aria-live="polite">等待选择内容</div>
    <details>
      <summary>权限和格式说明</summary>
      <p>扩展需要读取当前标签页，并从图片原地址下载资源。不会读取 API Key，也不会向翻译服务或其他服务器上传选区。</p>
    </details>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
